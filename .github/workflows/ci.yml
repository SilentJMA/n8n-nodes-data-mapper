name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # --ignore-scripts skips a native build of n8n-workflow's sandbox dependency,
      # which is only needed inside a running n8n instance.
      - run: npm install --ignore-scripts
      - run: npm run lint
      - run: npm test
